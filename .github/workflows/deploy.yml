name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync Theme
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22

          local_path: 'wp-content/themes/communitycvs'
          remote_path: '/vhosts/communitycvs.madeatsource.co.uk/htdocs/wp-content/themes/'
          args: '-vvv -o ConnectTimeout=5 -o StrictHostKeyChecking=no'
